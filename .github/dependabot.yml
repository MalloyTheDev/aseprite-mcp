version: 2
updates:
  # GitHub Actions used by CI. The workflow pins actions to commit SHAs; Dependabot
  # proposes SHA bumps (with version annotations) as reviewed PRs; no floating-tag risk.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"

  # Python dependencies. This is a uv project, so the "uv" ecosystem updates both
  # pyproject.toml constraints and uv.lock (the "pip" ecosystem would not touch the lock).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
