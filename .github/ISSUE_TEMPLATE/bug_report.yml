name: Bug report
description: Report an unexpected result or a problem getting the server to run
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Check existing issues first. If you have a small sprite or image that shows the
        problem and can be shared publicly, attach it below.
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: Include the exact tool call and arguments, or the setup steps that led to the error.
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Paste the error or describe the result, then tell us what you expected.
    validations:
      required: true
  - type: input
    id: server-version
    attributes:
      label: Aseprite MCP version or commit
      description: The release tag, checkout commit, or version reported by health_check.
    validations:
      required: false
  - type: textarea
    id: health-check
    attributes:
      label: health_check output
      description: >
        If the server starts, run `health_check` and paste the JSON. Remove private
        paths and other personal details before posting.
      render: json
    validations:
      required: false
  - type: input
    id: aseprite-version
    attributes:
      label: Aseprite version
      description: Include the editor version if it is missing from health_check.
      placeholder: "1.3.7"
    validations:
      required: false
  - type: input
    id: client
    attributes:
      label: MCP client
      description: Include the client name and version if you used one.
    validations:
      required: false
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11, macOS 15, Ubuntu 24.04
    validations:
      required: false
