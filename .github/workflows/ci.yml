name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to a PR makes the in-flight run obsolete; don't burn a runner on it.
# `main` is never cancelled, so every commit there keeps a complete result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: CI only reads the repo (no writes to contents, packages, etc.).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # `requires-python = ">=3.10"` has no upper bound, so every minor it
        # admits has to be tested or the claim is not one. 3.14 was added after
        # the suite was run against it locally: 956 passed, 499 skipped.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      # Actions are pinned to commit SHAs (supply-chain hardening); Dependabot keeps
      # them current and annotates the version (see .github/dependabot.yml).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }}

      - name: Lint (ruff)
        run: uv run --python ${{ matrix.python-version }} ruff check src tests scripts

      - name: Import check (server + all tool modules register)
        run: uv run --python ${{ matrix.python-version }} python -c "import asyncio; from aseprite_mcp.server import mcp; print('tools:', len(asyncio.run(mcp.list_tools())))"

      - name: Run unit tests (pure tier only; runners have no Aseprite)
        # CI runners have no Aseprite, so the integration/golden suites are gated
        # behind --run-aseprite (not passed here). The pure-Python unit tests
        # (colour parsing, Lua serialization, path sandbox) always run for real.
        run: uv run --python ${{ matrix.python-version }} pytest -q

      - name: Check generated tool docs are in sync
        run: uv run --python ${{ matrix.python-version }} python scripts/gen_tool_docs.py --check

      - name: Build wheel + sdist
        run: uv build
