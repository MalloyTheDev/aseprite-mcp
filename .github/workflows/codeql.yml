name: CodeQL

# Static security analysis of the Python source. Runs on every push/PR to main and
# weekly, so a newly-published query catches an old line of code without a push.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 5 * * 1"  # Mondays, 05:27 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze Python
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # required to upload the SARIF results
    steps:
      # Actions pinned to commit SHAs (supply-chain hardening); Dependabot keeps
      # them current and annotates the version (see .github/dependabot.yml).
      #
      # persist-credentials: false matters more here than in ci.yml: this job holds
      # `security-events: write`, so a token left in .git/config for later steps to read
      # is a token that can write code-scanning results. Nothing here pushes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: python
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:python"
